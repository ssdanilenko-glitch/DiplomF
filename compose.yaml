services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-service:dev
    container_name: llm-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://chat:${POSTGRES_PASSWORD:-chat}@postgres:5432/chat
      BOT_URL: http://bot:9000
      QDRANT_URL: http://qdrant:6333
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
      LLM__BASE_URL: http://ollama:11434/v1
      LLM__DEFAULT_MODEL: qwen3.5:9b
      LLM__OPENAI_API_KEY: ollama
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/ready', timeout=3).status == 200 else sys.exit(1)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7.4-alpine
    container_name: llm-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ----- Telegram-бот (если нужен) -----
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-service:dev
    container_name: chat-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKEND_URL:


    expose:
      - "9000"
    depends_on:
      app:
        condition: service_healthy
    command: ["python", "-m", "bot"]

  # ----- eXpress-бот (новый) -----
  express_bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-service:dev
    container_name: express-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKEND_URL: http://app:8000
      EXPRESS_BOT_ID: ${EXPRESS_BOT_ID}
      EXPRESS_CTS_HOST: ${EXPRESS_CTS_HOST}
      EXPRESS_SECRET_KEY: ${EXPRESS_SECRET_KEY}
      # Опционально: порт для вебхука (если используется отдельный)
      BOT_API_PORT: 9001
    expose:
      - "9001"
    depends_on:
      app:
        condition: service_healthy
    command: ["python", "-m", "express_bot"]   # модуль express_bot должен существовать

  postgres:
    image: postgres:16
    container_name: llm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chat
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chat}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.14.0
    container_name: llm-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__LOG_LEVEL: INFO
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: llm-phoenix
    restart: unless-stopped
    ports:
      - "6006:6006"
    volumes:
      - phoenix_data:/mnt/data

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Добавляем healthcheck, чтобы app мог дождаться готовности
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
volumes:
  redis_data:
  pg_data:
  qdrant_storage:
  phoenix_data:
  ollama_data: